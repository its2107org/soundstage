name: Soundstage
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Replaced with the real Apple Team ID when building for TestFlight.
    DEVELOPMENT_TEAM: SOUNDDEV00
    SOUNDSTAGE_BUNDLE_ID: com.$(DEVELOPMENT_TEAM).soundstage
    SOUNDSTAGE_KEYCHAIN_GROUP: $(AppIdentifierPrefix)com.$(DEVELOPMENT_TEAM).soundstage.shared
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Soundstage:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Core
      - path: Shared/Intents
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Soundstage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        SoundstageKeychainGroup: $(SOUNDSTAGE_KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: Soundstage talks to your Klipsch soundbar directly over your home Wi-Fi.
        NSBonjourServices:
          - _googlecast._tcp
          - _airplay._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - soundstage
    entitlements:
      path: App/Soundstage.entitlements
      properties:
        keychain-access-groups:
          - $(SOUNDSTAGE_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SOUNDSTAGE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SOUNDSTAGE_APP
    dependencies:
      - target: SoundstageWidget
        embed: true
        codeSign: true

  SoundstageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/Core
      - path: Shared/Intents
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Soundstage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SoundstageKeychainGroup: $(SOUNDSTAGE_KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: Soundstage talks to your Klipsch soundbar directly over your home Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/SoundstageWidget.entitlements
      properties:
        keychain-access-groups:
          - $(SOUNDSTAGE_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SOUNDSTAGE_BUNDLE_ID).Widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Soundstage:
    build:
      targets:
        Soundstage: all
    run:
      config: Debug
    archive:
      config: Release
